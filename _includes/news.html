<div class="well news-panel">
<h4 class="news-title"><span aria-hidden="true">🔥</span> News</h4>

<ul class="news-list">
{% for article in site.data.news limit:9 %}
  <li><span class="news-date">{{ article.date }}:</span> {{ article.headline | markdownify | remove: '<p>' | remove: '</p>' | strip }}</li>
{% endfor %}
</ul>

</div>
